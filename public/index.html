<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandeja · CRM ValleyTech</title>
<style>
  :root{
    --bg:#f2f4f1; --panel:#fff; --sunk:#e9ece7; --ink:#171c19; --soft:#5a635c;
    --faint:#8a938c; --rule:#d8dcd5; --accent:#0e6b57; --accent-ink:#fff;
    --warn-bg:#f6ebd6; --warn-ink:#8a5a05; --crit:#a32a1e; --bubble-in:#fff; --bubble-out:#dcede6;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e120f; --panel:#161b17; --sunk:#0a0d0b; --ink:#e8ece6; --soft:#a9b2aa;
      --faint:#7a847c; --rule:#2a312b; --accent:#5fccae; --accent-ink:#0b1512;
      --warn-bg:#33260f; --warn-ink:#e0ae5c; --crit:#f08c7e; --bubble-in:#1e241f; --bubble-out:#16342c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 12px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink)}
  .hide{display:none!important}

  /* ---------- login ---------- */
  #login{height:100vh;display:grid;place-items:center;padding:20px}
  #login form{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:30px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
  #login h1{margin:0;font-size:1.3rem}
  #login p{margin:0;color:var(--soft);font-size:.9rem}

  /* ---------- layout ---------- */
  #app{height:100vh;display:grid;grid-template-columns:340px 1fr}
  @media (max-width:780px){ #app{grid-template-columns:1fr} #thread.mobile-hidden{display:none} #list.mobile-hidden{display:none} }

  #list{border-right:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .list-head{padding:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
  .brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .brand strong{font-size:.95rem}
  .brand small{color:var(--faint);font-size:.75rem}
  #items{overflow-y:auto;flex:1;min-height:0}
  .item{padding:11px 13px;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .item:hover{background:var(--sunk)}
  .item.active{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
  .item .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item .name{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .time{color:var(--faint);font-size:.72rem;white-space:nowrap}
  .item .preview{color:var(--soft);font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;gap:5px;align-items:center;margin-top:2px}
  .badge{font-size:.66rem;padding:2px 6px;border-radius:99px;background:var(--sunk);color:var(--soft);border:1px solid var(--rule)}
  .badge.unread{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
  .badge.bot{background:transparent;color:var(--accent);border-color:var(--accent)}

  /* ---------- thread ---------- */
  #thread{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .thread-head{padding:11px 16px;border-bottom:1px solid var(--rule);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .thread-head .who strong{display:block;font-size:.95rem}
  .thread-head .who span{color:var(--faint);font-size:.78rem}
  .thread-actions{display:flex;gap:7px;flex-wrap:wrap}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px;min-height:0}
  .msg{max-width:min(560px,78%);padding:8px 12px;border-radius:10px;border:1px solid var(--rule);white-space:pre-wrap;word-break:break-word}
  .msg.inbound{background:var(--bubble-in);align-self:flex-start;border-bottom-left-radius:2px}
  .msg.outbound{background:var(--bubble-out);align-self:flex-end;border-bottom-right-radius:2px}
  .msg .meta{margin-top:4px;font-size:.68rem;color:var(--faint);display:flex;gap:7px;align-items:center}
  .msg .meta .err{color:var(--crit)}
  .msg img{max-width:100%;border-radius:6px;display:block;margin-top:6px}
  .notice{margin:0;padding:9px 16px;background:var(--warn-bg);color:var(--warn-ink);font-size:.84rem;border-bottom:1px solid var(--rule)}
  .composer{border-top:1px solid var(--rule);background:var(--panel);padding:11px 14px;display:flex;gap:9px;align-items:flex-end}
  .composer textarea{resize:none;min-height:42px;max-height:150px}
  .empty{flex:1;display:grid;place-items:center;color:var(--faint);text-align:center;padding:20px}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.87rem;max-width:90vw;z-index:9}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>CRM ValleyTech</h1>
    <p>Bandeja unificada de WhatsApp.</p>
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrar</button>
    <p id="loginError" style="color:var(--crit)"></p>
  </form>
</div>

<div id="app" class="hide">
  <aside id="list">
    <div class="list-head">
      <div class="brand">
        <div><strong id="tenantName">—</strong><br><small id="userName"></small></div>
        <button id="logout" title="Cerrar sesión">Salir</button>
      </div>
      <input id="search" type="search" placeholder="Buscar por nombre o número">
    </div>
    <div id="items"></div>
  </aside>

  <section id="thread" class="mobile-hidden">
    <div class="empty" id="placeholder">Elige una conversación para empezar.</div>

    <div id="threadBody" class="hide" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="thread-head">
        <div class="who">
          <button id="back" class="hide" style="margin-right:8px">←</button>
          <strong id="contactName">—</strong>
          <span id="contactPhone"></span>
        </div>
        <div class="thread-actions">
          <span class="badge" id="stageBadge">nuevo</span>
          <button id="botToggle">Pausar bot</button>
          <button id="closeConv">Cerrar</button>
        </div>
      </div>
      <p class="notice hide" id="windowNotice"></p>
      <div id="messages"></div>
      <div class="composer">
        <textarea id="draft" rows="1" placeholder="Escribe un mensaje…"></textarea>
        <button class="primary" id="send">Enviar</button>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="hide"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const state = { token: localStorage.getItem('crm_token'), user: null, conversations: [], current: null, socket: null };
const $ = (id) => document.getElementById(id);

function toast(text, ms = 3200) {
  const el = $('toast');
  el.textContent = text;
  el.classList.remove('hide');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hide'), ms);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw Object.assign(new Error(data?.error?.message || 'Error'), { payload: data?.error });
  return data;
}

// ---------------------------------------------------------------- sesión
$('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('loginError').textContent = '';
  try {
    const data = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: $('email').value, password: $('password').value }),
    });
    state.token = data.token;
    localStorage.setItem('crm_token', data.token);
    await start(data.user);
  } catch (err) {
    $('loginError').textContent = err.message;
  }
});

$('logout').addEventListener('click', logout);

function logout() {
  localStorage.removeItem('crm_token');
  state.token = null;
  state.socket?.disconnect();
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
}

async function start(user) {
  state.user = user;
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('tenantName').textContent = user.tenant?.name ?? 'CRM';
  $('userName').textContent = user.name + ' · ' + user.role;
  connectSocket();
  await loadConversations();
}

// ---------------------------------------------------------------- tiempo real
function connectSocket() {
  state.socket = io({ auth: { token: state.token } });
  state.socket.on('message:created', (message) => {
    if (state.current && message.conversationId === state.current.id) {
      appendMessage(message);
      scrollDown();
    }
    loadConversations({ silent: true });
  });
  state.socket.on('message:status', (payload) => {
    const node = document.querySelector('[data-msg="' + payload.id + '"] .status');
    if (node) node.textContent = statusLabel(payload.status);
    if (payload.status === 'failed') toast('Un mensaje falló: ' + (payload.errorMessage || payload.errorCode));
  });
  state.socket.on('conversation:updated', () => loadConversations({ silent: true }));
}

// ---------------------------------------------------------------- bandeja
let searchTimer;
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadConversations(), 300);
});

async function loadConversations({ silent = false } = {}) {
  const q = $('search').value.trim();
  const data = await api('/api/conversations?limit=50' + (q ? '&q=' + encodeURIComponent(q) : ''));
  state.conversations = data.items;
  renderList();
  if (!silent && state.current) {
    const fresh = data.items.find((c) => c.id === state.current.id);
    if (fresh) applyConversation(fresh);
  }
}

function renderList() {
  const container = $('items');
  container.innerHTML = '';

  if (state.conversations.length === 0) {
    container.innerHTML = '<div class="empty" style="padding:30px">Todavía no hay conversaciones.</div>';
    return;
  }

  for (const conversation of state.conversations) {
    const item = document.createElement('div');
    item.className = 'item' + (state.current?.id === conversation.id ? ' active' : '');
    item.innerHTML =
      '<div class="row"><span class="name"></span><span class="time"></span></div>' +
      '<div class="preview"></div><div class="badges"></div>';

    item.querySelector('.name').textContent = conversation.contact?.name || conversation.contact?.waId || 'Sin nombre';
    item.querySelector('.time').textContent = shortTime(conversation.lastMessageAt);
    item.querySelector('.preview').textContent = conversation.lastMessagePreview || '—';

    const badges = item.querySelector('.badges');
    if (conversation.unreadCount > 0) badges.appendChild(makeBadge(conversation.unreadCount, 'unread'));
    badges.appendChild(makeBadge(conversation.status));
    if (conversation.botActive) badges.appendChild(makeBadge('bot activo', 'bot'));

    item.addEventListener('click', () => openConversation(conversation));
    container.appendChild(item);
  }
}

function makeBadge(text, extra = '') {
  const span = document.createElement('span');
  span.className = 'badge ' + extra;
  span.textContent = text;
  return span;
}

// ---------------------------------------------------------------- hilo
async function openConversation(conversation) {
  applyConversation(conversation);

  $('placeholder').classList.add('hide');
  $('threadBody').classList.remove('hide');
  if (window.matchMedia('(max-width:780px)').matches) {
    $('list').classList.add('mobile-hidden');
    $('thread').classList.remove('mobile-hidden');
    $('back').classList.remove('hide');
  }

  const data = await api('/api/conversations/' + conversation.id + '/messages?limit=80');
  $('messages').innerHTML = '';
  data.items.forEach(appendMessage);
  scrollDown();

  if (conversation.unreadCount > 0) {
    await api('/api/conversations/' + conversation.id + '/read', { method: 'POST' });
    loadConversations({ silent: true });
  }
}

$('back').addEventListener('click', () => {
  $('list').classList.remove('mobile-hidden');
  $('thread').classList.add('mobile-hidden');
});

function applyConversation(conversation) {
  state.current = conversation;
  $('contactName').textContent = conversation.contact?.name || conversation.contact?.waId || 'Sin nombre';
  $('contactPhone').textContent = conversation.contact?.waId ?? '';
  $('stageBadge').textContent = conversation.pipelineStage;
  $('botToggle').textContent = conversation.botActive ? 'Pausar bot' : 'Reactivar bot';

  const open = conversation.withinServiceWindow;
  const notice = $('windowNotice');
  if (open) {
    notice.classList.add('hide');
  } else {
    notice.classList.remove('hide');
    notice.textContent =
      'La ventana de 24 horas está cerrada. WhatsApp solo acepta plantillas aprobadas hasta que el cliente vuelva a escribir.';
  }
  $('draft').disabled = !open;
  $('send').disabled = !open;
  renderList();
}

function appendMessage(message) {
  const node = document.createElement('div');
  node.className = 'msg ' + message.direction;
  node.dataset.msg = message.id;

  const body = document.createElement('div');
  body.textContent = message.text || describe(message);
  node.appendChild(body);

  if (message.mediaStorageKey && String(message.mediaMimeType || '').startsWith('image/')) {
    const img = document.createElement('img');
    img.src = '/api/media/' + message.id + '?token=' + encodeURIComponent(state.token);
    img.alt = 'Imagen recibida';
    img.loading = 'lazy';
    node.appendChild(img);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<span>' + shortTime(message.createdAt) + '</span>' +
    (message.direction === 'outbound' ? '<span class="status">' + statusLabel(message.status) + '</span>' : '') +
    (message.source === 'bot' ? '<span>bot</span>' : '');
  if (message.errorMessage) {
    const err = document.createElement('span');
    err.className = 'err';
    err.textContent = message.errorMessage;
    meta.appendChild(err);
  }
  node.appendChild(meta);

  $('messages').appendChild(node);
}

function describe(message) {
  if (message.type === 'template') return '[plantilla: ' + (message.content?.template?.name ?? '') + ']';
  if (message.type === 'interactive') return '[mensaje interactivo]';
  return '[' + message.type + ']';
}

function statusLabel(status) {
  return { queued: 'en cola', sent: 'enviado', delivered: 'entregado', read: 'leído', failed: 'falló' }[status] ?? status;
}

function shortTime(value) {
  if (!value) return '';
  const date = new Date(value);
  const today = new Date();
  const sameDay = date.toDateString() === today.toDateString();
  return sameDay
    ? date.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })
    : date.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
}

function scrollDown() {
  const box = $('messages');
  box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------- acciones
$('send').addEventListener('click', sendDraft);
$('draft').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendDraft(); }
});

async function sendDraft() {
  const text = $('draft').value.trim();
  if (!text || !state.current) return;

  $('send').disabled = true;
  try {
    await api('/api/conversations/' + state.current.id + '/messages', {
      method: 'POST',
      body: JSON.stringify({ type: 'text', text }),
    });
    $('draft').value = '';
    toast('Mensaje en cola de envío');
  } catch (err) {
    toast(err.message);
  } finally {
    $('send').disabled = false;
    $('draft').focus();
  }
}

$('botToggle').addEventListener('click', async () => {
  if (!state.current) return;
  const action = state.current.botActive ? 'pause' : 'resume';
  await api('/api/conversations/' + state.current.id + '/bot/' + action, { method: 'POST' });
  state.current.botActive = !state.current.botActive;
  $('botToggle').textContent = state.current.botActive ? 'Pausar bot' : 'Reactivar bot';
  toast(state.current.botActive ? 'Bot reactivado' : 'Bot pausado en esta conversación');
  loadConversations({ silent: true });
});

$('closeConv').addEventListener('click', async () => {
  if (!state.current) return;
  await api('/api/conversations/' + state.current.id, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'closed' }),
  });
  toast('Conversación cerrada');
  state.current = null;
  $('threadBody').classList.add('hide');
  $('placeholder').classList.remove('hide');
  loadConversations();
});

// ---------------------------------------------------------------- arranque
(async function boot() {
  if (!state.token) return;
  try {
    await start(await api('/api/auth/me'));
  } catch {
    logout();
  }
})();
</script>
</body>
</html>
